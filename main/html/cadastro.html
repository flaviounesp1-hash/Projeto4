<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="mainStyle.css">
</head>
<body>

  <header class="site-header">
    <h1>Quatro Patas</h1>
  </header>

  <main>
    <h2>Cadastro de Colaboradores</h2>

    <div class="checkout-grid">
      <!-- Formulário de Dados do Comprador -->
      <section class="checkout-box">
        <h3>Entre com seus Dados</h3>
        <form id="form-checkout" novalidate>
          <div class="form-grupo">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            <small class="msg-erro" id="erro-nome"></small>
          </div>

          <div class="form-grupo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
            <small class="msg-erro" id="erro-email"></small>
          </div>

          <div class="form-grupo">
            <label for="telefone">Telefone / Celular</label>
            <input type="tel" id="telefone" name="telefone" maxlength="15" required placeholder="(11) 99999-9999">
            <small class="msg-erro" id="erro-telefone"></small>
          </div>

          <div class="form-grupo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" maxlength="9" required placeholder="00000-000">
            <small class="msg-erro" id="erro-cep"></small>
          </div>

          <div class="form-grupo">
            <label for="endereco">Endereço Completo</label>
            <input type="text" id="endereco" name="endereco" required placeholder="Rua, número, complemento, bairro">
            <small class="msg-erro" id="erro-endereco"></small>
          </div>

          <div class="botoes-checkout">
            <a href="Checkout-novo" class="btn-voltar">Limpar Formulário</a>
            <button type="submit" class="btn-finalizar">Enviar Cadastro</button>
          </div>
        </form>
      </section>
 <!-- Resumo do Pedido -->
      <section class="checkout-box">
       <!--  <h3>Resumo do Pedido</h3>  -->
         <ul id="resumo-produtos" class="resumo-lista"></ul> 
        <div id="total-checkout" class="total-carrinho"></div>
      </section>
      
    </div>
  </main>

  <script src="cadastro.js"></script>
</body>
</html>
