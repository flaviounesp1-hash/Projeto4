 <html lang="pt-BR">

<head>
  
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
</head>
<body>
<header>
     <a href="../index.html"><img src="../assets/img/logo.jpg" id="Logotipo" alt="Logotipo com texto instituto quatro patas e uma figura estilizada de um gato aninhado num cachorro"  align="left" width="227" height="82" border="0" > </a>

	 <nav>
		<ul>
			<li><a href="../html/projeto.html">Atuação da ONG</a></li>
			<li><a href="../html/contato.html">Fale Conosco</a></li>
			<li><a href="../html/doador.html">Faça uma Doação</a></li>
			<li><a href="../html/padrinho.html">Seja um Padrinho</a></li>
			<li><a href="../html/adote.html">Adote um PET</a></li>

	</nav>
</header>
  <main>
    <h2>Cadastro de Usuário</h2>

    <form action="/cadastrar" method="POST">
      
      <!-- Agrupamento: Dados Pessoais -->
      <fieldset>
        <legend>Dados Pessoais</legend>

        <p>
          <label for="nome">Nome Completo:</label><br>
          <input 
            type="text" 
            id="nome" 
            name="nome" 
            required 
            minlength="3" 
            maxlength="100"
            autocomplete="name"
            placeholder="Digite seu nome completo">
        </p>

        <p>
          <label for="cpf">CPF:</label><br>
          <input 
            type="text" 
            id="cpf" 
            name="cpf" 
            required 
            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
            maxlength="14"
            placeholder="000.000.000-00"
            inputmode="numeric"
            oninput="mascaraCPF(this)">
        </p>

        <p>
          <label for="data-nascimento">Data de Nascimento:</label><br>
          <input 
            type="date" 
            id="data-nascimento" 
            name="dataNascimento" 
            required
            max="2026-12-31">
        </p>

        
      </fieldset>

      <!-- Agrupamento: Contato -->
      <fieldset>
        <legend>Informações de Contato</legend>

        <p>
          <label for="email">E-mail:</label><br>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            autocomplete="email"
            placeholder="seuemail@dominio.com">
        </p>

        <p>
          <label for="telefone">Telefone / Celular:</label><br>
          <input 
            type="tel" 
            id="telefone" 
            name="telefone" 
            required 
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
            maxlength="15"
            placeholder="(00) 00000-0000"
            inputmode="numeric"
            oninput="mascaraTelefone(this)">
        </p>
      </fieldset>

      <!-- Agrupamento: Áreas de Interesse -->
      <fieldset>
        <legend>Áreas de Interesse</legend>
        <p>Selecione um ou mais interesses:</p>

        <p>
          <input type="checkbox" id="interesse-adocao" name="interesses" value="adocao">
          <label for="interesse-adocao">Adoção</label>
        </p>

        <p>
          <input type="checkbox" id="interesse-doacao" name="interesses" value="doacao">
          <label for="interesse-doacao">Doação</label>
        </p>

        <p>
          <input type="checkbox" id="interesse-voluntariado" name="interesses" value="voluntariado">
          <label for="interesse-voluntariado">Voluntariado</label>
        </p>
      </fieldset>

      <!-- Botões de Ação -->
	  <p>
	  <button class="botao-primario">Enviar Cadastro</button>
      <button class="botao-primario">Limpar Formulário</button>
	  <p>
        

    </form>
  </main>
  <footer>
         <h4>&copy; 2026 Quatro Patas.</h4>
	    <h4>Flávio Assumpção Dall'Aglio</h4>
    </footer>

  <!-- JavaScript para aplicação das Máscaras de Entrada -->
  <script>
    function mascaraCPF(input) {
      let v = input.value.replace(/\D/g, "");
      v = v.substring(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      input.value = v;
    }

    function mascaraTelefone(input) {
      let v = input.value.replace(/\D/g, "");
      v = v.substring(0, 11);
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
      if (v.length > 13) {
        v = v.replace(/(\d{5})(\d)/, "$1-$2");
      } else {
        v = v.replace(/(\d{4})(\d)/, "$1-$2");
      }
      input.value = v;
    }
  </script>

</body>
</html>
